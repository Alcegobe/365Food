name: Déployer la PWA sur GitHub Pages

# Le déploiement GitHub Pages n'est autorisé que depuis la branche par défaut
# du dépôt. On ne déclenche donc le workflow que sur cette branche, sinon les
# autres branches (ex. main) produisent des runs rejetés par la gate
# d'environnement « github-pages ».
on:
  push:
    branches: ["claude/meal-planning-pwa-j947zv"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Empreinte le cache du service worker avec le SHA du commit : toute
      # mise à jour du shell (app.js/app.css/index.html) est ainsi livrée aux
      # utilisateurs installés sans dépendre d'un bump manuel dans sw.js.
      - name: Versionner le cache du service worker
        run: sed -i "s/365food-v[0-9A-Za-z]*/365food-${GITHUB_SHA::7}/" sw.js

      - name: Configurer Pages
        uses: actions/configure-pages@v5

      - name: Uploader le site (racine du repo)
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Déployer
        id: deployment
        uses: actions/deploy-pages@v4
