<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#e4eeea" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#181e1c" media="(prefers-color-scheme: dark)">
  <meta name="description" content="Livre de recettes healthy plaisir : besoins du jour, macros et budget de points.">
  <title>365Food</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23101413'/%3E%3Ccircle cx='32' cy='32' r='11' fill='%23ffffff'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/print.css" media="print">
</head>
<body>
  <a class="skip-link" href="#main">Aller au contenu</a>

  <header class="topbar">
    <a class="brand" href="#/" aria-label="365Food, accueil"><span class="brand__dot" aria-hidden="true"></span>365Food</a>
    <nav class="tabbar" aria-label="Sections">
      <a href="#/" data-route="today">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M3 11 12 4l9 7"/><path d="M5 10v10h14V10"/></svg>
        <span>Aujourd'hui</span>
      </a>
      <a href="#/recettes" data-route="recipes">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 19V5"/><path d="M8 7h7"/></svg>
        <span>Recettes</span>
      </a>
      <a href="#/planning" data-route="planner">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><rect x="3" y="4" width="18" height="17" rx="4"/><path d="M3 9h18M8 2v4M16 2v4M8 14h3M13 14h3M8 17.5h3"/></svg>
        <span>Planning</span>
      </a>
    </nav>
    <div class="topbar__actions">
      <a class="icon-btn" href="#/profil" aria-label="Profil" title="Profil">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/></svg>
      </a>
      <input type="file" id="import-file" accept="application/json,.json" hidden>
    </div>
  </header>

  <main id="main" class="container" tabindex="-1">
    <h1 class="visually-hidden">365Food</h1>
    <section id="view-dashboard" aria-label="Aujourd'hui" hidden></section>
    <section id="view-recipes" aria-label="Recettes" hidden></section>
    <section id="view-recipe" aria-label="Fiche recette" hidden></section>
    <section id="view-planner" aria-label="Planning" hidden></section>
    <section id="view-profile" aria-label="Profil" hidden></section>
    <noscript><p class="tile">Cette application a besoin de JavaScript.</p></noscript>
  </main>

  <dialog id="sheet" class="sheet"></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
