<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#e4eeea" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#181e1c" media="(prefers-color-scheme: dark)">
  <meta name="description" content="Livre de recettes healthy plaisir : calcule tes besoins (kcal, protéines, lipides, glucides) et ton budget de points. Tout reste sur ton appareil.">
  <title>365Food — Livre de recettes, macros &amp; points</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23101413'/%3E%3Ccircle cx='32' cy='32' r='11' fill='%23ffffff'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/print.css" media="print">
</head>
<body>
  <a class="skip-link" href="#main">Aller au contenu</a>

  <header class="topbar">
    <a class="brand" href="./" aria-label="365Food, accueil"><span class="brand__dot" aria-hidden="true"></span>365Food</a>
    <div class="topbar__actions">
      <button type="button" class="icon-btn" data-action="edit-profile" aria-label="Modifier le profil" title="Profil">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/></svg>
      </button>
      <input type="file" id="import-file" accept="application/json,.json" hidden>
    </div>
  </header>

  <main id="main" class="container" tabindex="-1">
    <h1 class="visually-hidden">365Food</h1>
    <section id="view-dashboard" aria-label="Tableau de bord" hidden></section>
    <section id="view-profile" aria-label="Profil" hidden></section>
    <noscript>
      <p class="tile">Cette application a besoin de JavaScript pour calculer tes besoins et enregistrer ton profil.</p>
    </noscript>
  </main>

  <footer class="footer">
    <p>Tes données restent sur cet appareil : aucun serveur, aucun traqueur. Pense à exporter une sauvegarde de temps en temps.</p>
  </footer>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
