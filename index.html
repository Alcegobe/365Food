<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#c2502a">
  <meta name="description" content="Livre de recettes healthy plaisir : calcule tes besoins (kcal, protéines, lipides, glucides) et ton budget de points. Tout reste sur ton appareil.">
  <title>365Food — Livre de recettes, macros &amp; points</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23c2502a'/%3E%3Ctext x='32' y='42' text-anchor='middle' font-family='Georgia,serif' font-size='26' font-weight='700' fill='%23fff7ee'%3E365%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/print.css" media="print">
</head>
<body>
  <a class="skip-link" href="#main">Aller au contenu</a>

  <header class="topbar">
    <div class="brand">
      <span class="brand__mark" aria-hidden="true">365</span>
      <div class="brand__text">
        <p class="brand__name">365Food</p>
        <p class="brand__tagline">Livre de recettes · macros &amp; points</p>
      </div>
    </div>
    <nav class="topbar__actions" aria-label="Actions principales">
      <button type="button" class="btn btn--ghost" data-action="edit-profile">Profil</button>
      <button type="button" class="btn btn--ghost" data-action="export">Exporter</button>
      <button type="button" class="btn btn--ghost" data-action="import">Importer</button>
      <input type="file" id="import-file" accept="application/json,.json" hidden>
    </nav>
  </header>

  <main id="main" class="container" tabindex="-1">
    <h1 class="visually-hidden">365Food</h1>
    <section id="view-dashboard" aria-label="Tableau de bord" hidden></section>
    <section id="view-profile" aria-label="Profil" hidden></section>
    <noscript>
      <p class="card">Cette application a besoin de JavaScript pour calculer tes besoins et enregistrer ton profil.</p>
    </noscript>
  </main>

  <footer class="footer">
    <p>Tes données restent sur cet appareil : aucun serveur, aucun traqueur. Pense à exporter une sauvegarde de temps en temps.</p>
  </footer>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
